[workspace]
members = ["crates/server", "crates/client"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["World Contributors"]
repository = "https://github.com/worldcoin/message-bridge"
readme = "README.md"

[workspace.dependencies]
aide = { version = "0.15.1", features = ["axum", "scalar"] }
axum = "0.8.9"
axum-jsonschema = { version = "0.9.1", features = ["aide"] }
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep", "gloo-timers-sleep"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
futures-util = "0.3"
http-body-util = "0.1.5"
message-bridge = { path = "crates/server", version = "0.1.0" }
redis = { version = "1.7.1", default-features = false, features = ["connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = { version = "0.9.0", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
telemetry-batteries = { version = "0.4.1", default-features = false, features = ["metrics-statsd"] }
thiserror = "2"
tokio = { version = "1.53.2", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = { version = "0.1.44", features = ["log"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
webpki-root-certs = "1"
