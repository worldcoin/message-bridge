[workspace]
members = ["crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["World Contributors"]
repository = "https://github.com/worldcoin/message-bridge"
readme = "README.md"

[workspace.dependencies]
aide = { version = "0.13.2", features = ["axum", "scalar"] }
axum = "0.7.9"
axum-jsonschema = { version = "0.8.0", features = ["aide"] }
chrono = "0.4.26"
dotenvy = "0.15.7"
http-body-util = "0.1.3"
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-webpki-roots-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = { version = "0.8.16", features = ["uuid1"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.145"
telemetry-batteries = { version = "0.3.2", default-features = false, features = ["metrics-statsd"] }
tokio = { version = "1.48.0", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing = { version = "0.1", features = ["log"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
