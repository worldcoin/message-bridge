[package]
name = "world-id-bridge-client"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "HTTP client for the World ID message bridge"
repository = "https://github.com/worldcoin/wallet-bridge"

[dependencies]
backon = { version = "1.6", default-features = false, features = ["std", "tokio-sleep", "gloo-timers-sleep"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
webpki-root-certs = "1"
