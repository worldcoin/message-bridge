name: Release Crates

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-pr:
    name: Prepare release PR
    if: github.repository == 'worldcoin/message-bridge' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Prepare release PR
        id: release-pr
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139 https://github.com/release-plz/action/releases/tag/v0.5.139
        with:
          command: release-pr
        env:
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Explicit dispatches run even when the PR was created with GITHUB_TOKEN.
      - name: Run CI on the release PR
        if: steps.release-pr.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
        run: |
          branch=$(jq -er '.head_branch | select(type == "string" and length > 0)' <<< "$RELEASE_PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  release:
    name: Publish crates
    if: github.repository == 'worldcoin/message-bridge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
      actions: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable

      - name: Publish crates
        id: release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5 # v0.5.139 https://github.com/release-plz/action/releases/tag/v0.5.139
        with:
          command: release
        env:
          RUSTUP_TOOLCHAIN: stable
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag pushes made with GITHUB_TOKEN do not trigger the Docker workflow.
      - name: Build Docker images for the release tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(jq -er '
            map(.version) | unique |
            if length == 1 and (.[0] | type == "string" and length > 0)
            then "v" + .[0]
            else error("expected one shared release version")
            end
          ' <<< "$RELEASES")
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$tag"
